# 每日价格更新：美元汇率 + 锂电材料
#
# 运行时间：每个工作日 16:00 UTC（cron 表达式 "0 16 * * 1-5"）。
# 换算成北京时间（UTC+8）是周二至周六 00:00。
# 选 16:00 UTC 的原因：
#   - 已晚于 A 股 / 广期所收盘（15:00 北京时间 = 07:00 UTC），当日期货收盘价已出；
#   - 已晚于欧洲央行当日参考价发布（约 16:00 CET = 15:00 UTC，夏令时约 14:00 UTC），
#     全年都覆盖，不会抓到前一日汇率。
# GitHub Actions 的 cron 可能有几分钟到几十分钟延迟，属于正常情况。
#
# 全程不使用任何密钥：部署靠 Netlify 的 Git 自动部署（仓库一有提交就自动发布），
# 不走 Netlify CLI token。推送用 Action 内置的 GITHUB_TOKEN（permissions 见下）。

name: 每日价格更新

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch: # 手动跑一次（Actions 页点 Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成页面
        run: python3 generate.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "无数据变化，不提交"
          else
            git commit -m "每日价格更新 $(date -u +%F)"
            git push
          fi
